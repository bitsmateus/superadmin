# nxdemo-og-inicio
# Demo Studio: robôs de preview de link (WhatsApp, Facebook, LinkedIn…) não rodam JavaScript. Só eles são
# desviados de /d, /l e /e para a página de Open Graph da API (server/src/routes/demoStudioOg.ts).
# O Dockerfile troca __NXDEMO_API__ pelo VITE_API_URL; sem ele, os blocos entre os marcadores são removidos.
map $http_user_agent $nxdemo_robo {
    default 0;
    "~*(whatsapp/|facebookexternalhit|facebot|twitterbot|telegrambot|slackbot|linkedinbot|discordbot|skypeuripreview|googlebot|bingbot|applebot|pinterest|redditbot)" 1;
}
# nxdemo-og-fim

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # nxdemo-og-inicio
    location ~ ^/(d|l|e)/ {
        # Resolvido na hora (e não na subida do nginx): se o DNS da API falhar, só o preview falha.
        resolver 127.0.0.11 8.8.8.8 valid=60s ipv6=off;
        proxy_ssl_server_name on;
        set $nxdemo_api "__NXDEMO_API__";
        set $nxdemo_og $nxdemo_robo;
        # ?nxv=1 vem do refresh da própria página de preview: uma pessoa com user-agent "parecido com robô" não entra em loop.
        if ($arg_nxv) {
            set $nxdemo_og 0;
        }
        if ($nxdemo_og) {
            rewrite ^/(.*)$ /api/public/ds/og/$1 break;
            proxy_pass $nxdemo_api;
        }
        try_files $uri /index.html;
    }
    # nxdemo-og-fim

    # React router — serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
